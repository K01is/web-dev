<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программа</title>
</head>
<body>
    <script>
        let a=+prompt('Введите a');
        let b=+prompt('Введите b');
        document.write('a+b='+(a+b)+'<br>');
        document.write('a-b='+(a-b)+'<br>');
        document.write('a*b='+(a*b)+'<br>');
        document.write('a/b='+(a/b));
    </script>
</body>
</html>
